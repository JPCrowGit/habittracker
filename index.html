<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15121a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Habits">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #15121a;
    --bg-soft: #1a1620;
    --card: #1e1a24;
    --card-hover: #241f2c;
    --border: #2c2733;
    --text: #f0eae2;
    --text-muted: #948c9c;
    --text-faint: #5e5768;
    --accent: #e7a83d;
    --accent-dim: #a87b34;
    --accent-soft: rgba(231,168,61,0.14);
    --accent-glow: rgba(231,168,61,0.55);
    --danger-dot: #3a3444;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  body{
    background-image:
      radial-gradient(ellipse 800px 400px at 50% -10%, rgba(231,168,61,0.06), transparent 60%);
  }

  .app{
    max-width: 640px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }

  header{
    margin-bottom: 40px;
  }

  .eyebrow{
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-faint);
    font-weight: 600;
    margin: 0 0 10px;
  }

  h1{
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: 34px;
    margin: 0 0 18px;
    letter-spacing: -0.01em;
  }

  .summary{
    display:flex;
    align-items:center;
    gap: 14px;
  }

  .ring{
    position: relative;
    width: 46px;
    height: 46px;
    flex-shrink: 0;
  }
  .ring svg{ transform: rotate(-90deg); width:100%; height:100%; }
  .ring circle{
    fill:none;
    stroke-width: 4;
  }
  .ring .track{ stroke: var(--border); }
  .ring .fill{
    stroke: var(--accent);
    stroke-linecap: round;
    transition: stroke-dashoffset 0.5s cubic-bezier(.4,1.6,.4,1);
  }
  .ring-label{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size: 11px; font-weight:600; color: var(--text);
  }

  .summary-text{ font-size: 14px; color: var(--text-muted); }
  .summary-text strong{ color: var(--text); font-weight: 600; }

  .list{
    display:flex;
    flex-direction: column;
    gap: 12px;
  }

  .habit{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    display:flex;
    align-items:center;
    gap: 16px;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .habit:hover{ background: var(--card-hover); }
  .habit.done{
    border-color: rgba(231,168,61,0.35);
  }

  /* --- Checkbox --- */
  .check-wrap{
    position: relative;
    width: 40px;
    height: 40px;
    flex-shrink: 0;
  }
  .check-btn{
    position: relative;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--bg-soft);
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    transition: transform 0.12s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  .check-btn:active{ transform: scale(0.9); }
  .check-btn.checked{
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  .check-btn.pop{ animation: popScale 0.42s cubic-bezier(.34,1.56,.64,1); }
  @keyframes popScale{
    0%{ transform: scale(1); }
    35%{ transform: scale(1.28); }
    60%{ transform: scale(0.92); }
    100%{ transform: scale(1); }
  }

  .check-btn svg.tick{
    width: 20px; height:20px;
    overflow: visible;
  }
  .check-btn svg.tick path{
    fill:none;
    stroke: var(--bg);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 24;
    stroke-dashoffset: 24;
    transition: stroke-dashoffset 0.28s ease 0.05s;
  }
  .check-btn.checked svg.tick path{
    stroke-dashoffset: 0;
  }

  .particle{
    position:absolute;
    top:50%; left:50%;
    width:5px; height:5px;
    border-radius:50%;
    background: var(--accent);
    pointer-events:none;
    opacity: 0;
  }
  .particle.burst{
    animation: burstOut 0.55s ease-out forwards;
  }
  @keyframes burstOut{
    0%{ opacity: 1; transform: translate(-50%,-50%) scale(1) translate(0,0); }
    100%{ opacity: 0; transform: translate(-50%,-50%) scale(0.3) translate(var(--dx), var(--dy)); }
  }

  /* --- Habit info --- */
  .habit-info{
    flex: 1;
    min-width: 0;
  }
  .habit-name{
    font-size: 15.5px;
    font-weight: 500;
    margin: 0 0 6px;
    color: var(--text);
    background: none;
    border: none;
    outline: none;
    font-family: inherit;
    padding: 0;
    width: 100%;
    cursor: text;
  }
  .habit-name:focus{ color: var(--accent); }

  .ribbon{
    display:flex;
    gap: 5px;
  }
  .ribbon .dot{
    width: 15px;
    height: 15px;
    border-radius: 5px;
    background: var(--danger-dot);
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .ribbon .dot.filled{ background: var(--accent-dim); }
  .ribbon .dot.today{
    outline: 1.5px solid var(--text-faint);
    outline-offset: 1.5px;
  }

  .streak{
    text-align: right;
    flex-shrink: 0;
    min-width: 54px;
  }
  .streak-num{
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 600;
    line-height: 1;
    color: var(--text-faint);
    transition: color 0.3s ease;
  }
  .streak-num.lit{ color: var(--accent); }
  .streak-label{
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-top: 3px;
  }

  /* --- Manage mode --- */
  .row-actions{
    display:flex;
    flex-direction: column;
    gap: 4px;
    flex-shrink: 0;
  }
  .icon-btn{
    width: 26px;
    height: 26px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--bg-soft);
    color: var(--text-muted);
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    font-size: 12px;
    line-height: 1;
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
  }
  .icon-btn:hover:not(:disabled){
    border-color: var(--accent);
    color: var(--accent);
  }
  .icon-btn:disabled{
    opacity: 0.35;
    cursor: default;
  }
  .icon-btn.delete-btn:hover:not(:disabled){
    border-color: #d16a5a;
    color: #d16a5a;
  }
  .reorder-btns{
    display:flex;
    flex-direction: column;
    gap: 4px;
  }

  .add-habit-row{
    background: var(--bg-soft);
    border: 1.5px dashed var(--border);
    border-radius: 16px;
    padding: 12px 14px;
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .add-habit-input{
    flex: 1;
    min-width: 0;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 14.5px;
    padding: 6px 2px;
  }
  .add-habit-input::placeholder{ color: var(--text-faint); }
  .add-habit-btn{
    width: 32px;
    height: 32px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: var(--bg);
    font-size: 18px;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.12s ease;
  }
  .add-habit-btn:active{ transform: scale(0.9); }

  .link{
    color: var(--text-faint);
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
  }
  .link:hover{ color: var(--accent); }

  footer{
    margin-top: 36px;
    text-align:center;
    font-size: 12.5px;
    color: var(--text-faint);
  }

  @media (max-width: 480px){
    .streak{ min-width: 40px; }
    .habit{ padding: 14px; gap: 12px; }
    .ribbon .dot{ width: 12px; height: 12px; }
  }

  @media (prefers-reduced-motion: reduce){
    .check-btn.pop{ animation: none; }
    .particle.burst{ animation: none; }
    *{ transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <p class="eyebrow" id="dateLabel">—</p>
    <h1>Today's habits</h1>
    <div class="summary">
      <div class="ring">
        <svg viewBox="0 0 46 46">
          <circle class="track" cx="23" cy="23" r="19"></circle>
          <circle class="fill" id="ringFill" cx="23" cy="23" r="19" stroke-dasharray="119.4" stroke-dashoffset="119.4"></circle>
        </svg>
        <div class="ring-label" id="ringLabel">0/5</div>
      </div>
      <div class="summary-text" id="summaryText">Nothing checked off yet.</div>
    </div>
  </header>

  <div class="list" id="list"></div>

  <footer>Tap the name to rename a habit &middot; misses a day, streak resets &middot; <span id="manageToggle" class="link">Manage habits</span> &middot; <span id="syncSettingsToggle" class="link">Sync</span> &middot; <span id="downloadData" class="link">Download data</span></footer>
</div>

<script>
(function(){
  const STORAGE_KEY = 'habit-tracker-v1';
  const SYNC_CONFIG_KEY = 'habit-tracker-sync-config';
  const DEFAULT_HABITS = [
    { id: 'h1', name: 'Move your body' },
    { id: 'h2', name: 'Read for 20 min' },
    { id: 'h3', name: 'Drink water' },
    { id: 'h4', name: 'No phone before bed' },
    { id: 'h5', name: 'Plan tomorrow' }
  ];

  let state = { habits: DEFAULT_HABITS, completions: {} };
  let manageMode = false;

  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function dateStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function addDays(d, n){ const c = new Date(d); c.setDate(c.getDate()+n); return c; }

  const today = new Date();
  const todayStr = dateStr(today);

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(parsed && parsed.habits && parsed.completions){
          state = parsed;
        }
      }
    }catch(e){
      // corrupted or missing data, fall back to defaults
    }
    render();
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){
      console.error('Could not save habit data', e);
    }
    syncPush();
  }

  // --- Cross-device sync (optional) -----------------------------------
  // localStorage stays the source of truth for instant load/offline use;
  // sync is a best-effort overlay on top. Last write wins -- if two
  // devices are edited offline before either syncs, whichever pushes
  // last overwrites the other. Fine for a single person's own habits.

  function getSyncConfig(){
    try{
      return JSON.parse(localStorage.getItem(SYNC_CONFIG_KEY) || 'null');
    }catch(e){
      return null;
    }
  }

  function setSyncConfig(cfg){
    localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(cfg));
  }

  function promptSyncSettings(){
    const existing = getSyncConfig() || { apiUrl: '', apiKey: '' };
    const apiUrl = prompt('API URL (from `cdk deploy` output, e.g. https://xxxx.execute-api.us-east-1.amazonaws.com/api/state):', existing.apiUrl);
    if(apiUrl === null) return;
    const apiKey = prompt('API key (the /habittracker/api_key SSM value):', existing.apiKey);
    if(apiKey === null) return;
    if(!apiUrl.trim() || !apiKey.trim()){
      localStorage.removeItem(SYNC_CONFIG_KEY);
      alert('Sync disabled.');
      return;
    }
    setSyncConfig({ apiUrl: apiUrl.trim(), apiKey: apiKey.trim() });
    alert('Sync configured. Pulling latest synced data now...');
    syncPull();
  }

  function syncPush(){
    const cfg = getSyncConfig();
    if(!cfg) return;
    fetch(cfg.apiUrl, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'x-habit-key': cfg.apiKey },
      body: JSON.stringify(state)
    }).catch((e) => console.error('Sync push failed', e));
  }

  function syncPull(){
    const cfg = getSyncConfig();
    if(!cfg) return;
    fetch(cfg.apiUrl, { headers: { 'x-habit-key': cfg.apiKey } })
      .then((res) => { if(!res.ok) throw new Error('sync pull HTTP ' + res.status); return res.json(); })
      .then((remote) => {
        if(remote && remote.habits && remote.completions){
          state = remote;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          render();
        }
      })
      .catch((e) => console.error('Sync pull failed', e));
  }

  function downloadData(){
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'habit-tracker-export-' + todayStr + '.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function calcStreak(habitId){
    const comp = state.completions;
    let cursor = new Date(today);
    // don't penalize "today" if not yet checked — start counting from
    // today if done, otherwise from yesterday
    if(!(comp[todayStr] && comp[todayStr][habitId])){
      cursor = addDays(cursor, -1);
    }
    let streak = 0;
    while(true){
      const key = dateStr(cursor);
      if(comp[key] && comp[key][habitId]){
        streak++;
        cursor = addDays(cursor, -1);
      } else {
        break;
      }
    }
    return streak;
  }

  function last7Days(){
    const days = [];
    for(let i = 6; i >= 0; i--){
      days.push(dateStr(addDays(today, -i)));
    }
    return days;
  }

  function isDone(dateKey, habitId){
    return !!(state.completions[dateKey] && state.completions[dateKey][habitId]);
  }

  function toggleHabit(habitId, btnEl){
    if(!state.completions[todayStr]) state.completions[todayStr] = {};
    const wasDone = !!state.completions[todayStr][habitId];
    state.completions[todayStr][habitId] = !wasDone;
    saveState();

    if(!wasDone){
      animateCheck(btnEl);
    }
    render();
  }

  function animateCheck(btnEl){
    if(!btnEl) return;
    btnEl.classList.remove('pop');
    void btnEl.offsetWidth;
    btnEl.classList.add('pop');

    const wrap = btnEl.parentElement;
    const count = 6;
    for(let i = 0; i < count; i++){
      const p = document.createElement('span');
      p.className = 'particle';
      const angle = (Math.PI * 2 * i) / count;
      const dist = 22 + Math.random()*6;
      p.style.setProperty('--dx', (Math.cos(angle)*dist)+'px');
      p.style.setProperty('--dy', (Math.sin(angle)*dist)+'px');
      wrap.appendChild(p);
      requestAnimationFrame(()=>{ p.classList.add('burst'); });
      setTimeout(()=>{ p.remove(); }, 600);
    }
  }

  function renameHabit(habitId, newName){
    const h = state.habits.find(h => h.id === habitId);
    if(h && newName.trim()){
      h.name = newName.trim();
      saveState();
    }
  }

  function moveHabit(habitId, dir){
    const idx = state.habits.findIndex(h => h.id === habitId);
    const newIdx = idx + dir;
    if(idx === -1 || newIdx < 0 || newIdx >= state.habits.length) return;
    const [h] = state.habits.splice(idx, 1);
    state.habits.splice(newIdx, 0, h);
    saveState();
    render();
  }

  function deleteHabit(habitId){
    const h = state.habits.find(h => h.id === habitId);
    if(!h) return;
    if(!confirm('Delete "' + h.name + '"?')) return;
    state.habits = state.habits.filter(x => x.id !== habitId);
    saveState();
    render();
  }

  function addHabit(name){
    const trimmed = name.trim();
    if(!trimmed) return;
    state.habits.push({ id: 'h' + Date.now() + Math.floor(Math.random()*1000), name: trimmed });
    saveState();
    render();
  }

  function render(){
    document.getElementById('dateLabel').textContent = today.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });

    const list = document.getElementById('list');
    list.innerHTML = '';
    const days = last7Days();
    let doneToday = 0;

    state.habits.forEach((habit, index) => {
      const done = isDone(todayStr, habit.id);
      if(done) doneToday++;
      const streak = calcStreak(habit.id);

      const row = document.createElement('div');
      row.className = 'habit' + (done ? ' done' : '');

      const checkWrap = document.createElement('div');
      checkWrap.className = 'check-wrap';
      const btn = document.createElement('button');
      btn.className = 'check-btn' + (done ? ' checked' : '');
      btn.setAttribute('aria-label', (done ? 'Mark incomplete: ' : 'Mark complete: ') + habit.name);
      btn.innerHTML = '<svg class="tick" viewBox="0 0 20 20"><path d="M4 10 L8 14 L16 5"/></svg>';
      btn.addEventListener('click', () => toggleHabit(habit.id, btn));
      checkWrap.appendChild(btn);

      const info = document.createElement('div');
      info.className = 'habit-info';
      const nameInput = document.createElement('input');
      nameInput.className = 'habit-name';
      nameInput.value = habit.name;
      nameInput.spellcheck = false;
      nameInput.addEventListener('change', (e) => renameHabit(habit.id, e.target.value));
      nameInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') e.target.blur(); });
      info.appendChild(nameInput);

      const ribbon = document.createElement('div');
      ribbon.className = 'ribbon';
      days.forEach(d => {
        const dot = document.createElement('div');
        dot.className = 'dot' + (isDone(d, habit.id) ? ' filled' : '') + (d === todayStr ? ' today' : '');
        ribbon.appendChild(dot);
      });
      info.appendChild(ribbon);

      row.appendChild(checkWrap);
      row.appendChild(info);

      if(manageMode){
        const actions = document.createElement('div');
        actions.className = 'row-actions';

        const reorder = document.createElement('div');
        reorder.className = 'reorder-btns';
        const upBtn = document.createElement('button');
        upBtn.className = 'icon-btn';
        upBtn.textContent = '▲';
        upBtn.setAttribute('aria-label', 'Move up: ' + habit.name);
        upBtn.disabled = index === 0;
        upBtn.addEventListener('click', () => moveHabit(habit.id, -1));
        const downBtn = document.createElement('button');
        downBtn.className = 'icon-btn';
        downBtn.textContent = '▼';
        downBtn.setAttribute('aria-label', 'Move down: ' + habit.name);
        downBtn.disabled = index === state.habits.length - 1;
        downBtn.addEventListener('click', () => moveHabit(habit.id, 1));
        reorder.appendChild(upBtn);
        reorder.appendChild(downBtn);

        const delBtn = document.createElement('button');
        delBtn.className = 'icon-btn delete-btn';
        delBtn.textContent = '✕';
        delBtn.setAttribute('aria-label', 'Delete: ' + habit.name);
        delBtn.addEventListener('click', () => deleteHabit(habit.id));

        actions.appendChild(reorder);
        actions.appendChild(delBtn);
        row.appendChild(actions);
      } else {
        const streakEl = document.createElement('div');
        streakEl.className = 'streak';
        streakEl.innerHTML = '<div class="streak-num' + (streak > 0 ? ' lit' : '') + '">' + streak + '</div><div class="streak-label">day' + (streak === 1 ? '' : 's') + '</div>';
        row.appendChild(streakEl);
      }

      list.appendChild(row);
    });

    if(manageMode){
      const addRow = document.createElement('div');
      addRow.className = 'add-habit-row';
      const addInput = document.createElement('input');
      addInput.className = 'add-habit-input';
      addInput.placeholder = 'Add a habit…';
      addInput.spellcheck = false;
      const addBtn = document.createElement('button');
      addBtn.className = 'add-habit-btn';
      addBtn.textContent = '+';
      addBtn.setAttribute('aria-label', 'Add habit');
      const submitAdd = () => { addHabit(addInput.value); };
      addBtn.addEventListener('click', submitAdd);
      addInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') submitAdd(); });
      addRow.appendChild(addInput);
      addRow.appendChild(addBtn);
      list.appendChild(addRow);
    }

    const total = state.habits.length;
    const pct = total ? doneToday / total : 0;
    const circumference = 119.4;
    document.getElementById('ringFill').style.strokeDashoffset = circumference * (1 - pct);
    document.getElementById('ringLabel').textContent = doneToday + '/' + total;

    const summaryText = document.getElementById('summaryText');
    if(doneToday === 0){
      summaryText.innerHTML = 'Nothing checked off yet.';
    } else if(doneToday === total){
      summaryText.innerHTML = '<strong>All done</strong> for today.';
    } else {
      summaryText.innerHTML = '<strong>' + doneToday + ' of ' + total + '</strong> done today.';
    }

    const manageToggle = document.getElementById('manageToggle');
    manageToggle.textContent = manageMode ? 'Done managing' : 'Manage habits';
  }

  document.getElementById('manageToggle').addEventListener('click', () => {
    manageMode = !manageMode;
    render();
  });

  document.getElementById('syncSettingsToggle').addEventListener('click', promptSyncSettings);
  document.getElementById('downloadData').addEventListener('click', downloadData);

  loadState();
  syncPull();

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').then((reg) => {
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        newWorker.addEventListener('statechange', () => {
          if(newWorker.state === 'installed' && navigator.serviceWorker.controller){
            if(confirm('An update is available. Reload now?')){
              window.location.reload();
            }
          }
        });
      });
    }).catch((e) => console.error('Service worker registration failed', e));
  }
})();
</script>
